<!DOCTYPE html>
<html lang="en">

<th:block th:replace="~{includes/admin/head}" />

<body id="page-top">

<!-- Page Wrapper -->
<div id="wrapper">
    <th:block th:replace="~{includes/admin/sidebar}" />
    <script>
        $(".nav_board_a").removeClass("collapsed");
        $(".nav_board_div").addClass("show");
    </script>

    <!-- Content Wrapper -->
    <div id="content-wrapper" class="d-flex flex-column">

        <!-- Main Content -->
        <div id="content">
            <th:block th:replace="~{includes/admin/topbar}" />

            <!-- Begin Page Content -->
            <div class="container-fluid">

                <!-- Page Heading -->
                <h1 class="h3 mb-2 text-gray-800">Board : <span class="font_board_title">-</span> </h1>
                <p class="mb-4">Board 상세 입니다.</p>

                <div class="mb-4">
                    <div class="form-group row">
                        <input type="hidden" id="detail_board_id" />
                        <!-- 로그인 정보가 없어도 에러 안나게 빈값 처리 -->
                        <input type="hidden" id="detail_user_id" value="" />

                        <label class="col-sm-2 col-form-label">*삭제여부</label>
                        <div class="col-sm-4">
                            <select class="input_param input_required form-control mb-2" id="detail_board_deleted" name="deleted" onchange="update_board(this)">
                                <option value="" selected="selected">전체</option>
                                <option value="false">일반</option>
                                <option value="true">삭제</option>
                            </select>
                        </div>
                        <label class="col-sm-6"></label>
                        <label class="col-sm-2 col-form-label">*제목</label>
                        <div class="col-sm-4">
                            <input type="text" class="input_param input_required form-control mb-2" id="detail_board_title" name="title" placeholder="제목을 입력해주세요!" onchange="update_board(this)" />
                        </div>
                        <label class="col-sm-6"></label>

                        <label class="col-sm-2 col-form-label">내용</label>
                        <div class="col-sm-10">
                            <textarea class="input_param form-control mb-2" id="detail_board_content" name="content" placeholder="내용을 입력해주세요!" onchange="update_board(this)" ></textarea>
                        </div>

                        <label class="col-sm-2 col-form-label">cate</label>
                        <div class="col-sm-10">
                            <textarea class="input_param form-control mb-2" id="detail_board_cate" name="cate" placeholder="내용을 입력해주세요!" onchange="update_board(this)" ></textarea>
                        </div>

                        <label class="col-sm-2 col-form-label">minamount</label>
                        <div class="col-sm-10">
                            <textarea class="input_param form-control mb-2" id="detail_board_minamount" name="minamount" placeholder="내용을 입력해주세요!" onchange="update_board(this)" ></textarea>
                        </div>

                        <label class="col-sm-2 col-form-label">메인 사진</label>
                        <div class="col-sm-10">
                            <input type="text" class="input_param form-control mb-2" id="detail_board_img" name="img" placeholder="제목을 입력해주세요!" onchange="update_board(this)" />
                            <input type="file" class="form-control mb-2" id="board_img" accept="image/*" placeholder="내용을 입력해주세요!" onchange="listenerSetImage(this, listener_upload_img)"/>
                            <img class="hide" id="img_board_img" style="height: 75px;" alt="메인 사진" />
                        </div>

                        <!-- 좋아요/싫어요 버튼 UI -->
                        <label class="col-sm-2 col-form-label">반응</label>
                        <div class="col-sm-10">
                            <button type="button" class="btn btn-outline-primary" id="btn_like_true" onclick="click_like(true)">
                                👍 좋아요 <span id="text_count_like_up">0</span>
                            </button>
                            <button type="button" class="btn btn-outline-danger" id="btn_like_false" onclick="click_like(false)">
                                👎 싫어요 <span id="text_count_like_down">0</span>
                            </button>
                            <input type="hidden" id="my_boardlike_id" />
                        </div>
                    </div>
                </div>
            </div>
            <!-- /.container-fluid -->

        </div>
        <!-- End of Main Content -->

        <th:block th:replace="~{includes/admin/footer}" />

    </div>
    <!-- End of Content Wrapper -->

</div>
<!-- End of Page Wrapper -->

<th:block th:replace="~{includes/admin/bottom}" />

<script>
    $(document).ready(function () {
        detail_board();
        check_my_like();
    });

    // 좋아요/싫어요 버튼 클릭 함수
    function click_like(isLike) {
        let id = $("#my_boardlike_id").val();
        if(id === "") id = null;

        let boardId = getIdFromUrl(null);
        let userId = $("#detail_user_id").val();

        // 로그인 안되어있으면 테스트 ID(1) 사용
        if (!userId) {
            userId = 1;
        }

        // 1. 이미 누른 상태(id 존재) -> 취소 로직
        if (id) {
            if(confirm("이미 반응을 남기셨습니다. 취소하시겠습니까?")){
                $.ajax({
                    url: "/api/boardlike",
                    type: "DELETE",
                    contentType: "application/json",
                    data: JSON.stringify({ id: id }),
                    success: function() {
                        alert("취소되었습니다.");
                        location.reload();
                    },
                    error: function() {
                        alert("취소 실패");
                    }
                });
            }
            return;
        }

        let params = {
            boardId: boardId,
            userId: userId,
            liked: isLike
        };

        $.ajax({
            url: "/api/boardlike",
            type: "POST",
            contentType: "application/json",
            data: JSON.stringify(params),
            success: function() {
                alert("반영되었습니다.");
                location.reload();
            },
            error: function() {
                alert("등록 실패");
            }
        });
    }

    // 내 좋아요 상태 확인 함수
    function check_my_like() {
        let boardId = getIdFromUrl(null);
        let userId = $("#detail_user_id").val();

        // 로그인 안되어있으면 테스트 ID(1) 사용
        if(!userId) userId = 1;

        $.ajax({
            url: "/api/boardlike/list",
            type: "GET",
            data: {
                boardId: boardId,
                userId: userId
            },
            success: function(data) {
                if (data && data.length > 0) {
                    let myLike = data[0];
                    $("#my_boardlike_id").val(myLike.id);

                    if(myLike.liked) {
                        $("#btn_like_true").removeClass("btn-outline-primary").addClass("btn-primary");
                        $("#btn_like_false").prop("disabled", true);
                    } else {
                        $("#btn_like_false").removeClass("btn-outline-danger").addClass("btn-danger");
                        $("#btn_like_true").prop("disabled", true);
                    }
                }
            }
        });
    }

    function listener_upload_img() {
        // 파일 담기
        let tempFile = null;
        let inputFile = document.getElementById('board_img');
        if (inputFile.files.length > 0) {
            tempFile = inputFile.files[0];
        }
        let fileData = new FormData();
        fileData.append("file", tempFile);
        $.ajax({
            url: "/api/default/uploadFile",
            type: "POST",
            data: fileData ,
            cache : false,
            contentType : false,
            processData : false,
            success: (data, status, xhr)=>{
                $("#detail_board_img").val("/image/" + data);
                update_board("#detail_board_img");
            },
            error: (data)=>{
                alert("error")
            },
        });
    }

    function update_board(obj_this){
        let _param = {
            id : getIdFromUrl(null)
        };
        _param[$(obj_this).attr("name")] = $(obj_this).val();
        let _data = {};
        _data.url = "/api/board";
        _data.type = "PUT";
        _data.param = _param;
        _data.success = function(obj_data, obj_status, obj_xhr){
        }
        _data.error = function(obj_data, obj_status, obj_xhr){
            alert("정상적으로 이루어지지 않았습니다. 다시 시도해주세요.");
        }
        func_ajax(_data);
    }

    function detail_board() {
        let boardId = getIdFromUrl(null);
        let _data = new Map();
        _data.url = "/api/board";
        _data.type = "GET";
        _data.param = {'id': boardId};
        _data.success = function (obj_data, obj_status, obj_xhr) {
            listenerAfterDetail(obj_data, "board");
            $("#text_count_like_up").text(obj_data.countlikeup || 0);
            $("#text_count_like_down").text(obj_data.countlikedown || 0);
        }
        _data.error = function (obj_data, obj_status, obj_xhr) {
            alert("정상적으로 이루어지지 않았습니다. 다시 시도해주세요.");
        }
        func_ajax(_data);
    }
</script>

</body>
</html>
